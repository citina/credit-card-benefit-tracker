<!DOCTYPE html>
<html>
<head>
<base target="_top">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root{--bg:#faf9f5;--surface:#fff;--text:#1a1a18;--muted:#6b6a64;--border:#e6e4dc;--green:#0F6E56}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif;background:var(--bg);color:var(--text);padding:24px 16px}
  .wrap{max-width:460px;margin:48px auto 0}
  .card{background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:28px 24px;text-align:center}
  .q{font-size:18px;font-weight:500;margin-bottom:22px;line-height:1.45}
  .msg{font-size:17px;line-height:1.5;margin-bottom:20px}
  .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
  .btn{font-size:15px;padding:10px 18px;border-radius:8px;cursor:pointer;text-decoration:none;display:inline-block;border:1px solid var(--border)}
  .btn.primary{background:var(--green);color:#fff;border-color:var(--green)}
  .btn.primary:disabled{opacity:.5;cursor:default}
  .btn.ghost{background:var(--surface);color:var(--text)}
</style>
</head>
<body>
<div class="wrap">
  <div class="card">
    <div id="view">
      <div class="q"><?= question ?></div>
      <div class="actions">
        <button id="yes" class="btn primary"></button>
        <a id="cancel" class="btn ghost" href="<?= dashUrl ?>"></a>
      </div>
    </div>
    <div id="result" style="display:none">
      <div class="msg" id="msg"></div>
      <a id="openDash" class="btn ghost" href="<?= dashUrl ?>"></a>
    </div>
  </div>
</div>
<script>
  var CTX = <?!= ctxJson ?>;
  document.getElementById('yes').textContent = CTX.confirmLabel;
  document.getElementById('cancel').textContent = CTX.cancelLabel;
  document.getElementById('openDash').textContent = CTX.openDash;

  function showResult(message){
    document.getElementById('msg').textContent = message;
    document.getElementById('view').style.display = 'none';
    document.getElementById('result').style.display = 'block';
  }
  document.getElementById('yes').addEventListener('click', function(){
    var b = document.getElementById('yes');
    b.disabled = true; b.textContent = '…';
    google.script.run
      .withSuccessHandler(function(res){ showResult(res && res.message ? res.message : '✓'); })
      .withFailureHandler(function(err){ showResult(String(err && err.message || err)); })
      .confirmFromEmail(CTX.action, CTX.id, CTX.days, CTX.token);
  });
</script>
</body>
</html>
